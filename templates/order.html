{% extends 'guest_orders_base.html' %}{% load static %}
{% block page %}guest-order{% endblock %}
{% block content %}<a class="orders-back" href="/account/"><span aria-hidden="true">←</span><span data-ru="Мои заказы" data-kz="Тапсырыстарым">Мои заказы</span></a><button type="button" id="guest-status-reopen" class="guest-status-reopen" hidden><span class="guest-status-dot" aria-hidden="true"></span><span data-ru="Статус заказа" data-kz="Тапсырыс күйі">Статус заказа</span><span aria-hidden="true">↗</span></button>
<dialog id="guest-status-window" class="guest-status-window" aria-labelledby="guest-status-title" aria-describedby="guest-status-description"><div class="guest-status-window-top"><span>TUYSQAN COFFEE</span><div class="guest-status-window-tools"><div class="language-switch" aria-label="Язык / Тіл"><button type="button" data-set-language="ru">RU</button><button type="button" data-set-language="kz">KZ</button></div><button type="button" class="guest-status-close" id="guest-status-close" aria-label="Закрыть / Жабу">×</button></div></div><div id="guest-status-content" aria-live="polite" aria-atomic="true"></div><div id="guest-status-mascot-slot"></div><button type="button" id="guest-status-details" class="guest-status-details" data-ru="Посмотреть заказ" data-kz="Тапсырысты көру">Посмотреть заказ</button></dialog>
<section id="order-detail" aria-live="polite"></section>{{ order|json_script:'order-data' }}{% endblock %}

{% block head %}{{ block.super }}<link rel="stylesheet" href="{% static 'css/guest-loyalty.css' %}?v=1"><link rel="stylesheet" href="{% static 'css/griffin-mascot.css' %}?v=5">{% endblock %}
{% block scripts %}<script src="{% static 'js/guest-order-status.js' %}?v=station-times-4" defer></script><script src="{% static 'js/griffin-mascot.js' %}?v=3" defer></script>{% endblock %}
