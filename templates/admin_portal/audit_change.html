<div class="ap-audit-change">
<span class="ap-audit-label" data-ru="{{ change.label_ru }}" data-kz="{{ change.label_kz }}">{{ change.label_ru }}</span>
<div class="ap-audit-values"><span class="ap-audit-before" data-ru="{{ change.before_ru }}" data-kz="{{ change.before_kz }}">{{ change.before_ru }}</span><span class="ap-audit-arrow" aria-hidden="true">→</span><strong class="ap-audit-after" data-ru="{{ change.after_ru }}" data-kz="{{ change.after_kz }}">{{ change.after_ru }}</strong></div>
</div>
