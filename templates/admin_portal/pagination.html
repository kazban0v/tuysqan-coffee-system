{% load admin_format %}{% if pager.paginator.num_pages > 1 %}<nav class="ap-pagination" aria-label="Страницы / Беттер">{% if pager.has_previous %}<a class="ap-button secondary" href="{% ap_query request page=pager.previous_page_number %}" data-ru="Назад" data-kz="Артқа">Назад</a>{% else %}<span></span>{% endif %}<span>{{ pager.number }} / {{ pager.paginator.num_pages }}</span>{% if pager.has_next %}<a class="ap-button secondary" href="{% ap_query request page=pager.next_page_number %}" data-ru="Далее" data-kz="Келесі">Далее</a>{% else %}<span></span>{% endif %}</nav>{% endif %}
