{% extends 'admin_portal/base.html' %}{% load admin_format %}{% block admin_content %}<form class="ap-toolbar" method="get"><label class="ap-field"><span data-ru="Поиск заказа, гостя, номера" data-kz="Тапсырыс, қонақ, нөмірді іздеу">Поиск заказа, гостя, номера</span><input name="q" value="{{ filters.q }}" type="search"></label><label class="ap-field"><span data-ru="Статус" data-kz="Күйі">Статус</span><select name="status"><option value="" data-ru="Все статусы" data-kz="Барлық күй">Все статусы</option>{% for value,label in statuses %}<option value="{{ value }}" {% if filters.status == value %}selected{% endif %} data-ru="{{ value|status_ru }}" data-kz="{{ value|status_kz }}">{{ label }}</option>{% endfor %}</select></label><label class="ap-field"><span data-ru="Источник" data-kz="Дереккөз">Источник</span><select name="source"><option value="" data-ru="Все" data-kz="Барлығы">Все</option><option value="web" {% if filters.source == 'web' %}selected{% endif %}>QR</option><option value="pos" {% if filters.source == 'pos' %}selected{% endif %} data-ru="Касса" data-kz="Касса">Касса</option></select></label><div class="ap-date-range"><label class="ap-field"><span data-ru="С даты" data-kz="Басталу күні">С даты</span><input type="date" name="start" value="{{ filters.start }}"></label><label class="ap-field"><span data-ru="По дату" data-kz="Аяқталу күні">По дату</span><input type="date" name="end" value="{{ filters.end }}"></label></div><div class="ap-filter-actions"><button class="ap-button" data-ru="Найти" data-kz="Іздеу">Найти</button><a href="/admin/orders/" class="ap-button secondary" data-ru="Сбросить" data-kz="Тазалау">Сбросить</a></div></form><section class="ap-card"><div class="ap-section-head"><h2 data-ru="Все заказы" data-kz="Барлық тапсырыс">Все заказы</h2><span>{{ order_page.paginator.count }}</span></div>{% include 'admin_portal/order_rows.html' with order_rows=order_page %}{% include 'admin_portal/pagination.html' with pager=order_page %}</section>{% endblock %}
